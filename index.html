<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Моя Игра</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .card {
            text-align: center;
            padding: 20px;
        }
        #click-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #click-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="user-greeting">Привет, Игрок!</h1>
        <p>Счет: <strong id="score">0</strong></p>
        <button id="click-btn">Нажми меня!</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Берем имя пользователя из Telegram, если доступно
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}!`;
        }

        let score = 0;
        const scoreEl = document.getElementById('score');
        const btn = document.getElementById('click-btn');

        btn.addEventListener('click', () => {
            score++;
            scoreEl.innerText = score;
            // Легкая вибрация телефона при клике
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
    </script>
</body>
</html>
